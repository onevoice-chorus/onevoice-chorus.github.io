<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ONE VOICE 2027 参加費のお支払い（高校生）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
<div class="logo">OneVoice</div>
<div class="sub">1000人合唱プロジェクト feat. Symphonic Starmine 2027</div>
</header>
<main class="wrap">
<h1>参加費のお支払い</h1>
<div class="kind">高校生（15,800円）</div>
<p>当選された方だけが購入できます。高校生ご本人のエントリー番号とお名前を入力してください。</p>
<form id="form" novalidate>
<p class="note">・お名前は、エントリーのときと同じ字で入力してください（日本語は全角）。<br>・外国籍の方は、姓・名を英字（ローマ字）でも入力できます。<br>・フリガナは、全角カタカナで入力してください。</p>
<div id="people"></div>
<div id="error" class="error hidden"></div>
<button type="submit" id="btn">次へ</button>
</form>
</main>
<script src="app.js"></script>
<script>initEntry('koukousei');</script>
</body>
</html>
